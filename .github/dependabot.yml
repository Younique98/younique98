# STANDARDS.md, Supply chain: the workflows' pinned actions are updated
# weekly, grouped, and only once a release is seven days old. This
# repository has no package manager, so GitHub Actions is the only ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
