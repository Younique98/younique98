name: Secret scan

# STANDARDS.md, Encryption, secrets and keys: every push is scanned for
# credentials. A key pushed even once stays in the history and is found by
# automated scanners within minutes.
#
# Pushes to any branch and pull requests scan the new commits. A weekly run,
# and a manual run when a repository first adopts these standards, scan the
# entire history, so a credential committed before adoption is found too.

on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned scanner version: the action runs the container with this tag, so
  # leaving it unset would run whatever "latest" is that day.
  TRUFFLEHOG_VERSION: "3.97.9"

jobs:
  new-commits:
    name: Secret scan (new commits)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The first push of a new branch has no "before" commit. Left alone,
      # the scanner then reads the branch's entire history, so a finding
      # from years ago fails every new branch. Scan only the commits the
      # branch adds on top of the default branch instead; the weekly
      # full-history job below still covers everything older.
      - name: Choose the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$DELETED" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            head="$AFTER"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                # Creating the default branch (a repository's first push):
                # there is nothing older to compare with, so scan everything.
                base=""
              else
                # Empty when the branch shares no history with the default
                # branch: everything is scanned.
                base=$(git merge-base "origin/$DEFAULT_BRANCH" "$head" 2>/dev/null || true)
              fi
            else
              base="$BEFORE"
            fi
          fi
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "No new commits to scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "base=$base"; echo "head=$head"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - if: ${{ steps.range.outputs.skip != 'true' }}
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: ${{ env.TRUFFLEHOG_VERSION }}
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown

  full-history:
    name: Secret scan (full history)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan every commit on every branch
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          docker run --rm -v "$PWD:/repo" "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            git file:///repo --results=verified,unknown --fail
